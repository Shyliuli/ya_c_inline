[package]
name = "ya-c-inline-build"
version = "0.1.0"
edition = "2021"
description = "Build-time code generator for ya-c-inline"
license = "MIT OR Apache-2.0"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
